[package]
name = "velocity_mcp"
version = "3.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "A high-performance, zero-allocation Model Context Protocol (MCP) server in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
homepage = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
documentation = "https://docs.rs/velocity_mcp"
keywords = ["mcp", "model-context-protocol", "ai", "llm", "server"]
categories = ["web-programming", "development-tools"]
readme = "README.md"

[workspace]
members = [".", "macros", "client"]
exclude = ["bench_nda"]

[features]
default = []
http = ["axum", "tokio", "tokio-stream", "tower", "tower-http", "uuid", "rustls", "rustls-pemfile", "tokio-rustls", "hyper", "hyper-util", "http-body-util", "prometheus", "futures", "lru"]
oauth2 = ["ureq", "aes-gcm", "hmac"]
database = ["rusqlite"]
observability = ["opentelemetry", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
quick-xml = "0.41"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
velocity_mcp_macros = { version = "0.1.0", path = "macros" }
ctor = "0.2"

# Optional: HTTP/SSE transport
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"], optional = true }
http-body-util = { version = "0.1", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
prometheus = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
lru = { version = "0.12", optional = true }

# Optional: OAuth2 connectors
ureq = { version = "2.9", features = ["json"], optional = true }

# Optional: Database resources
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# Optional: Encrypted token storage
aes-gcm = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }

# Optional: Observability (OpenTelemetry)
opentelemetry = { version = "0.22", optional = true }
opentelemetry-otlp = { version = "0.15", optional = true }
opentelemetry-semantic-conventions = { version = "0.14", optional = true }
tracing-opentelemetry = { version = "0.23", optional = true }

# Configuration management
toml = "0.8"

# Error handling
thiserror = "2"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Filesystem utilities
glob = "0.3"
diffy = "0.4"

# Linux-specific sandboxing
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.4"
nix = { version = "0.28", features = ["process", "signal"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3.0"
tempfile = "3.10"

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "nda_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

