[package]
name = "velocity_mcp"
version = "3.0.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "A high-performance, zero-allocation Model Context Protocol (MCP) server in Rust"
license = "MIT OR Apache-2.0"

[features]
default = []
http = ["axum", "tokio", "tokio-stream", "tower", "tower-http", "uuid"]
oauth2 = ["ureq", "aes-gcm"]
database = ["rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
quick-xml = "0.41"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
velocity_mcp_macros = { path = "macros" }

# Optional: HTTP/SSE transport
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }

# Optional: OAuth2 connectors
ureq = { version = "2.9", features = ["json"], optional = true }

# Optional: Database resources
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# Optional: Encrypted token storage
aes-gcm = { version = "0.10", optional = true }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

