[package]
name = "velocity-mcp-core"
version = "3.2.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "WASM-compatible core protocol logic for VELOCITY-MCP — pure MCP JSON-RPC handling with no OS dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
homepage = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
documentation = "https://docs.rs/velocity-mcp-core"
keywords = ["mcp", "wasm", "json-rpc", "protocol", "ai"]
categories = ["web-programming", "no-std", "wasm"]
readme = "../../README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No tokio, no axum, no OS-specific crates - pure protocol logic only

[features]
default = []
wasm = []  # Enable WASM-specific exports

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dispatch_bench"
harness = false
