[package]
name = "velocity-mcp-edge"
version = "3.2.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Wasmer Edge deployment target for VELOCITY-MCP — HTTP server with security layers and 10 pure-Rust tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
homepage = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
documentation = "https://docs.rs/velocity-mcp-edge"
keywords = ["mcp", "wasmer", "edge", "wasm", "serverless"]
categories = ["web-programming", "wasm"]
readme = "../../README.md"

[lib]
name = "velocity_mcp_edge"
path = "src/lib.rs"

[[bin]]
name = "velocity-edge"
path = "src/main.rs"

[dependencies]
velocity-mcp-core = { version = "3.2.0", path = "../velocity-mcp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Native and WASIX socket HTTP server.
[target.'cfg(any(not(target_arch = "wasm32"), target_vendor = "wasmer"))'.dependencies]
hyper = { version = "1", features = ["server", "http1"] }
http = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
subtle = "2.5"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }

# Plain WASI CGI builds do not include the socket server.
[target.'cfg(all(target_arch = "wasm32", not(target_vendor = "wasmer")))'.dependencies]
cgi = "0.6.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
serde_json = "1.0"
hyper = { version = "1", features = ["server", "http1", "client"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "client-legacy"] }

[[bench]]
name = "load_test"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("wasmer"))'] }
