services:
  velocity-mcp:
    # Relative paths in this file resolve against deploy/, the directory holding it.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: velocity-mcp
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - VELOCITY_HTTP_ADDR=0.0.0.0:3000
      # Decorative: plugin_dir has no environment override; the bind mount below
      # lands on /app/plugins, which is what the default value already resolves to.
      - VELOCITY_PLUGIN_DIR=/app/plugins
    volumes:
      - ../plugins:/app/plugins:ro
      - velocity-data:/app/data
      - velocity-marketplace:/app/marketplace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - velocity-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: velocity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - velocity-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: velocity-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - velocity-network
    profiles:
      - monitoring

volumes:
  velocity-data:
  velocity-marketplace:
  prometheus-data:
  grafana-data:

networks:
  velocity-network:
    driver: bridge
