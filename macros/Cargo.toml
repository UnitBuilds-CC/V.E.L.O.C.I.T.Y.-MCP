[package]
name = "velocity_mcp_macros"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Proc-macro crate for type-safe MCP tool registration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnitBuilds-CC/V.E.L.O.C.I.T.Y.-MCP"
keywords = ["mcp", "proc-macro", "ai", "llm"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
