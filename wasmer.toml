[package]
name = "unitbuilds/velocity-mcp-edge"
version = "3.19.4"
description = "VELOCITY-MCP serverless deployment on Wasmer Edge - Model Context Protocol with 10 pure-Rust edge tools"
readme = "docs/edge_user_guide.md"

[[module]]
name = "velocity-edge"
source = "target/wasm32-wasmer-wasi/release/velocity-edge.wasm"
abi = "wasi"

[[command]]
name = "velocity-edge"
module = "velocity-edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = ["PORT=80"]
